name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-req=ext-grpc

      - name: Check code style
        run: ./bin/php-cs ./src ./tests

      - name: Static analysis
        run: ./bin/phpstan analyse --no-progress

      - name: Run tests with coverage
        run: XDEBUG_MODE=coverage php -d memory_limit=-1 ./bin/phpunit --coverage-text=.phpunit.cache/coverage.txt

      - name: Enforce 100% coverage
        run: ./bin/php-coverage-check .phpunit.cache/coverage.txt
